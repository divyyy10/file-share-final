<!doctype html>
<html lang="en">

    <!-- ===================== -->

    <!-- ===================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===================== -->

    <!-- ===================== -->
    <title>FlashDrop — Fast QR File Sharing Between Any Devices</title>

    <!-- ===================== -->
    <!-- FAVICON / LOGO -->
    <!-- ===================== -->
    <link rel="icon" href="/logo.png" />

    <!-- ===================== -->
    <!-- OPEN GRAPH (SOCIAL MEDIA) -->
    <!-- ===================== -->
    <meta property="og:title" content="FlashDrop — Instant QR File Sharing" />
    <meta property="og:description" content="Share files instantly between any devices using QR code. No login, no signup." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flashdrop.qzz.io" />
    <meta property="og:image" content="https://flashdrop.qzz.io/logo.png" />

    <!-- ===================== -->
